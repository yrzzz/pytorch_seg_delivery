# FROZEN SparK-pretrained tenxnet_recipe encoder -> P1-P5 FPN -> Ridgepath head (bilinear x2 to full res).
# Frozen-transfer PROBE: freeze the whole SSL encoder, train only FPN + head. Clean measure of whether the
# on-domain SparK pretraining (tenxnet_recipe on the 229k boundary tiles) features help boundary seg.
# tenxnet_recipe gives a native stride-2 (level-1) endpoint (fpn_min_level=1, head_level=1, bilinear x2).
#
# Encoder weights: SparK timm-style export -> packaged via scripts/package_spark_encoder.py to
# cache/tenxnet_recipe_spark_seg_encoder.pth (138 tensors, loads 0-missing/0-unexpected).
#
# NOTE (BN): SparK estimates BN running stats over VISIBLE pixels during pretraining. For a frozen probe
# those feed dense inference (freeze_encoder_eval: true keeps .eval() so BN uses running stats + SD off).
# If the frozen probe underperforms, prefer the unfrozen config (re-adapts BN) or a BN-recalibration pass.
encoder: tenxnet_recipe
encoder_norm: bn
in_chans: 2
num_classes: 9
model_kwargs: {}                       # RidgepathSegModel path; fpn/head defaults set by build_seg_model

manifest: cache/manifest_cell_tenxnet_train.csv    # 6076 labeled cell-boundary tiles (tenxnet split)
val_manifest: cache/manifest_cell_tenxnet_val.csv  # 658 labeled cell-boundary tiles
augment: true
seg_channels: [boundary, DAPI]                 # ch0=boundary, ch1=DAPI (matches SparK 2-ch pretraining)
target_params: {dist_cutoff: 15.0, weight_sigma: 1.0, smooth_range: 3, weighted_loss: true}

# --- frozen SSL encoder: load pretrained weights, freeze whole run ---
init: seg_encoder
seg_checkpoint: cache/tenxnet_recipe_spark_seg_encoder.pth
freeze_encoder_epochs: 300          # == epochs -> encoder frozen for the whole run (requires_grad=False)
freeze_encoder_eval: true           # encoder in .eval(): BN uses running stats, stochastic-depth off

optimizer: adamw
lr: 0.003                           # single LR: FPN + head (random-init); encoder LR gated to 0 while frozen
weight_decay: 0.0001
lr_schedule: cosine
warmup_epochs: 5
epochs: 300
batch_size: 32
num_workers: 8
amp: true
amp_dtype: bf16                     # Ada GPU
grad_clip: 5.0

out_dir: runs/tenxnet_recipe_spark_frozen
seed: 0
save_every: 10
log_every: 20
