# FROZEN DINOv3 ConvNeXt-Small 4-stage backbone ONLY (NO hi-res branch) -> 4-stage FPN (P2-P5, strides
# 4/8/16/32) -> Ridgepath head at level 2 (stride 4) -> bilinear x4 to full res.
# Frozen-transfer PROBE: freeze the whole DINOv3 encoder, train only FPN + head. Clean measure of what
# off-the-shelf DINOv3 ConvNeXt features give for boundary seg, and the safe baseline for the unfrozen arm
# (convnext_dino_4stage_unfrozen_normal_cell.yaml).
# NOTE: finest feature is stride-4 -> bilinear x4 to full res, so boundaries are coarse (that's the no-hi-res trade-off).
# PREREQS: timm installed; DINOv3 weights cached (HF_HUB_OFFLINE=1 for the run; pretrained: true).
encoder: convnext_dino
in_chans: 2
num_classes: 9
model_kwargs: {pretrained: true, timm_model: "convnext_small.dinov3_lvd1689m"}

manifest: cache/manifest_cell_tenxnet_train.csv    # 6076 labeled cell-boundary tiles (tenxnet split)
val_manifest: cache/manifest_cell_tenxnet_val.csv  # 658 labeled cell-boundary tiles
augment: true
aug:
  color_quant_bins: [64, 128, 256, 512]
  color_quant_prob: 0.5
  brightness_delta: 0.0
  contrast_range: [1.0, 1.0]
  mirror_prob: 0.0
  rot_choices: [0]
seg_channels: [boundary, DAPI]                 # ch0=boundary, ch1=DAPI
target_params: {dist_cutoff: 15.0, weight_sigma: 1.0, smooth_range: 3, weighted_loss: true}

# --- DINOv3 encoder loaded fresh via timm; FROZEN whole run; FPN + head random init ---
init: timm_convnext
freeze_encoder_epochs: 300          # == epochs -> encoder frozen for the whole run (requires_grad=False)
freeze_encoder_eval: true           # encoder in .eval(): stochastic-depth off, LayerNorm batch-independent

optimizer: adamw
lr: 0.003                           # FPN + head (random init); encoder LR gated to 0 while frozen
weight_decay: 0.0001
lr_schedule: cosine
warmup_epochs: 5
min_lr: 0.000001
epochs: 300
batch_size: 11                      # frozen encoder (no encoder backward) -> larger batch than the unfrozen arm; tune to VRAM
num_workers: 8
amp: true
amp_dtype: bf16                     # Ada GPU
grad_clip: 5.0

out_dir: runs/convnext_small_dino_frozen_normal_cell
seed: 0
save_every: 10
log_every: 20
